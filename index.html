<style>
:root{--acc:#3f9b3a;--g1:#8fd16a;--lt:#eef8e4;--dk:#2a6a2a;--bg:#fff;--tx:#33402b;--ok:#2a9d6a;--bad:#d6402a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a2018;--lt:#27331f;--tx:#eaf5df;--dk:#b8e59a}}
:root[data-theme=dark]{--bg:#1a2018;--lt:#27331f;--tx:#eaf5df;--dk:#b8e59a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2','Nunito',system-ui,sans-serif;touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:440px;margin:0 auto;padding:6px 8px 12px}
#hud{display:flex;gap:6px;font-weight:800;font-size:14px;margin-bottom:6px}
#hud span{flex:1;text-align:center;background:var(--lt);border:2px solid var(--g1);border-radius:14px;padding:4px 2px;color:var(--dk);box-shadow:0 3px 0 var(--g1)}
canvas#cv{width:100%;display:block;border-radius:16px;border:3px solid var(--g1);touch-action:none}
button{font:inherit;font-weight:800;color:var(--dk);background:var(--lt);border:2px solid var(--g1);border-radius:14px;box-shadow:0 3px 0 var(--g1);padding:10px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g1)}button:disabled{opacity:.4}
.row{display:flex;gap:6px;margin-top:8px}.row button{flex:1;font-size:16px}
#bb,#bo{background:linear-gradient(var(--g1),var(--acc));color:#fff;border-color:var(--acc);box-shadow:0 3px 0 var(--dk);flex:2.2}
#ov{position:fixed;inset:0;background:rgba(20,40,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}#ov[hidden]{display:none}
#box{background:var(--bg);width:100%;max-width:440px;max-height:82%;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border:3px solid var(--g1)}
.r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--g1);gap:6px;font-size:14px}
.r small{display:block;opacity:.7;font-size:11px}.r button{padding:4px 7px;font-size:12px;line-height:1.2}.g{color:var(--ok)}.b{color:var(--bad)}
.r canvas{width:38px;height:38px;flex:none}h2{margin:0 0 8px;color:var(--dk)}
[hidden]{display:none!important}.cl{width:100%;margin-top:12px;font-size:16px}
#top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#shop{flex:1;display:flex;gap:8px;align-items:center;background:#1f3a2a;color:#fff;border:2px solid var(--g1);border-radius:14px;padding:4px 8px}
#shop canvas{width:44px;height:44px;border-radius:10px;border:2px solid #fff;flex:none}#shop>div{flex:1}#shop b{font-size:14px}#lv{font-size:11px;opacity:.9}
#xb{height:7px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;margin-top:3px}#xf{display:block;height:100%;background:linear-gradient(#ffc04a,#f08a1c)}
#coin{background:#1f3a2a;color:#ffe066;font-weight:800;border-radius:14px;border:2px solid var(--g1);padding:9px 10px;white-space:nowrap}
#gear{padding:6px 9px;font-size:20px;background:#1f3a2a;color:#fff}
#stage{position:relative}.col{position:absolute;top:5%;display:flex;flex-direction:column;gap:6px;width:16%}#cl{left:1.5%}#cr{right:1.5%}
.col button,#nav button{background:linear-gradient(#5a3a1e,#3a2410);color:#fff;border:2px solid #c4a050;box-shadow:0 3px 0 #1a0f06;padding:4px 0;font-size:9.5px;line-height:1.15;border-radius:11px}
.col button b,#nav button b{display:block;font-size:22px}
#nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
#bot{display:flex;gap:6px;margin-top:8px;align-items:stretch}#bo{flex:1.1;font-size:16px;line-height:1.15}
#info{flex:2;display:flex;justify-content:space-around;align-items:center;background:#1f3a2a;color:#fff;border:2px solid var(--g1);border-radius:14px;padding:6px 8px;font-size:12px;text-align:center}
#info b{display:block;font-size:15px;color:#ffe066}#info small{opacity:.8;font-size:10px}
#ld{position:fixed;inset:0;z-index:20;background:linear-gradient(#bfe8a8,#e8f6d8 55%,#c9b79a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#2a6a2a}
#aw{position:absolute;top:0;left:0;right:0;height:46px;border-radius:0 0 22px 22px;background:repeating-linear-gradient(90deg,#2f8f3a 0 28px,#fff 28px 56px);box-shadow:0 5px 0 rgba(0,0,0,.15)}
#lt{font:900 46px/1 'Baloo 2',system-ui,sans-serif;color:#f6f0cf;background:linear-gradient(#3b7a3a,#24592a);border:6px solid #7a4a22;border-radius:16px;padding:12px 26px;text-shadow:0 3px 0 #173d1b;box-shadow:0 6px 0 #4d2f14;margin-top:30px}
#lt small{display:block;font-size:13px;font-weight:700;margin-top:6px;color:#d9efb8;text-shadow:none}
#lc{width:100%;max-width:320px}#lp{width:220px;height:14px;border-radius:9px;background:rgba(0,0,0,.15);overflow:hidden;border:2px solid #7a4a22}
#lf{display:block;height:100%;width:0;background:linear-gradient(#ffd166,#f08a1c)}
#lb{display:flex;flex-direction:column;gap:10px;width:230px}#lb button{font-size:18px}#lb small{display:block;font-size:11px;opacity:.9}
#lb .big{background:linear-gradient(#ffc04a,#f08a1c);color:#fff;border-color:#c26a0c;box-shadow:0 4px 0 #8a4a08;padding:14px}
#lcr{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-weight:800;font-size:14px}
.pb{height:6px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden;margin-top:3px}.pb i{display:block;height:100%;background:linear-gradient(#ffd166,#f08a1c)}h3.sh{margin:10px 0 0;color:var(--dk);font-size:15px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1f3a2a;color:#ffe066;font-weight:800;padding:8px 14px;border-radius:14px;border:2px solid var(--g1);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}#toast.on{opacity:1}input[type=range]{touch-action:none;accent-color:var(--acc)}
.cd{border:2px solid var(--g1);border-radius:18px;padding:10px 14px;margin:8px 0}.cd h3{margin:0 0 4px;color:var(--dk);font-size:15px}.sr{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}.sr i,.sf i{display:block;height:9px;border-radius:5px;background:var(--lt);overflow:hidden}.sr u,.sf u{display:block;height:100%;border-radius:5px}.sr b{min-width:56px;text-align:right}.sf{padding:5px 0;font-size:14px;border-bottom:1px dashed var(--g1)}.sf>div{display:flex;justify-content:space-between;margin-bottom:4px}
/* bố cục gọn: chợ to hết cỡ, dải nút luôn thấy */
#app{padding:4px 6px 4px}
#top{margin-bottom:4px;gap:5px}
#shop{padding:3px 7px;gap:7px}#shop canvas{width:36px;height:36px}#shop b{font-size:13px}#lv{font-size:10px}#xb{height:5px;margin-top:2px}
#coin{padding:7px 8px;font-size:14px}#gear{padding:4px 8px;font-size:18px}
#stage{width:fit-content;max-width:100%;margin:0 auto}
